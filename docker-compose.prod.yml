version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_web
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce_nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro

# Note: This prod compose keeps SQLite for simplicity (dev/proof-of-concept).
# For real production, replace `web` DB with Postgres and remove sqlite bind mount.
