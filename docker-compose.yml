version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_backend
    restart: unless-stopped
    volumes:
      - .:/app
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:

        VITE_API_URL: http://${SERVER_IP:-localhost}:8000/api/v1
    container_name: react_frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend